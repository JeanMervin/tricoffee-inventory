{% extends 'base.html' %}
{% block title %}Add Item{% endblock %}
{% block page_title %}<i class="fas fa-plus me-2" style="color:var(--coffee-light)"></i>Add Item{% endblock %}

{% block content %}
<div class="page-header">
  <h1 class="page-h1">Add New Item</h1>
  <a href="{{ url_for('staff.items') }}" class="btn btn-outline-secondary btn-sm">
    <i class="fas fa-arrow-left me-1"></i>Back
  </a>
</div>

<div class="row justify-content-center">
  <div class="col-lg-7">
    <div class="card">
      <div class="card-header">Item Details</div>
      <div class="card-body p-4">
        <form method="POST" novalidate>
          <div class="mb-3">
            <label class="form-label">Item Name <span class="text-danger">*</span></label>
            <input type="text" name="name" class="form-control" placeholder="e.g. Chocolate Sauce" required autofocus>
          </div>

          <div class="row g-3 mb-3">
            <div class="col-md-6">
              <label class="form-label">Category <span class="text-danger">*</span></label>
              <select name="category_id" class="form-select" required>
                <option value="">— Select Category —</option>
                {% for cat in categories %}
                <option value="{{ cat.id }}">{{ cat.name }}</option>
                {% endfor %}
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label">
                Weigh-In Unit
                <small class="text-muted fw-normal">— daily measure</small>
              </label>
              <select name="unit_type" class="form-select">
                <option value="g/ml">g/ml (weight or volume)</option>
                <option value="pcs">pcs (pieces — cups, lids, etc.)</option>
              </select>
            </div>
          </div>

          <div class="mb-4">
            <label class="form-label">Storage Unit</label>
            <input type="hidden" name="storage_unit" value="pcs">
            <input type="text" class="form-control" value="pcs" disabled>
            <div class="form-text">Storage quantities are always counted in pieces (pcs).</div>
          </div>

          <div class="mb-4">
            <label class="form-label">Minimum Stock Threshold</label>
            <input type="number" name="minimum_stock" class="form-control" value="10" min="0" step="0.01">
            <div class="form-text">Flags item as Low Stock when area qty drops below this.</div>
          </div>

          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-coffee px-4">
              <i class="fas fa-plus me-1"></i>Add Item
            </button>
            <a href="{{ url_for('staff.items') }}" class="btn btn-outline-secondary">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
