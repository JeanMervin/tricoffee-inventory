{% extends 'base.html' %}
{% block title %}Add User{% endblock %}
{% block page_title %}<i class="fas fa-user-plus me-2" style="color:var(--coffee-light)"></i>Add User{% endblock %}

{% block content %}
<div class="page-header">
  <h1 class="page-h1">Add New User</h1>
  <a href="{{ url_for('admin.users') }}" class="btn btn-outline-secondary btn-sm">
    <i class="fas fa-arrow-left me-1"></i>Back
  </a>
</div>

<div class="row justify-content-center">
  <div class="col-lg-6">
    <div class="card">
      <div class="card-header">Account Details</div>
      <div class="card-body p-4">
        <form method="POST" novalidate>
          <div class="mb-3">
            <label class="form-label">Username <span class="text-danger">*</span></label>
            <input type="text" name="username" class="form-control" required autofocus>
          </div>
          <div class="mb-3">
            <label class="form-label">Full Name</label>
            <input type="text" name="full_name" class="form-control">
          </div>
          <div class="mb-3">
            <label class="form-label">Password <span class="text-danger">*</span></label>
            <input type="password" name="password" class="form-control" minlength="6" required>
            <div class="form-text">At least 6 characters.</div>
          </div>
          <div class="mb-3">
            <label class="form-label">Role</label>
            <select name="role" class="form-select" id="roleSelect" onchange="toggleBranch()">
              <option value="staff">Staff</option>
              <option value="admin">Admin</option>
            </select>
          </div>
          <div class="mb-4" id="branchField">
            <label class="form-label">Branch</label>
            <select name="branch" class="form-select">
              <option value="1">Tricoffee 1</option>
              <option value="2">Tricoffee 2</option>
            </select>
          </div>
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-coffee px-4">
              <i class="fas fa-plus me-1"></i>Create User
            </button>
            <a href="{{ url_for('admin.users') }}" class="btn btn-outline-secondary">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
function toggleBranch() {
  const role = document.getElementById('roleSelect').value;
  document.getElementById('branchField').style.display = role === 'admin' ? 'none' : '';
}
toggleBranch();
</script>
{% endblock %}
