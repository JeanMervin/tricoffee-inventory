<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bad Request — TRICOFFEE</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #1a0f08; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: #2C1810;
    }
    .card {
      background: #fff; border-radius: 20px; padding: 48px 40px; max-width: 440px; width: 90%;
      text-align: center; box-shadow: 0 32px 80px rgba(0,0,0,0.4);
    }
    .code { font-size: 3.5rem; font-weight: 700; color: #8B5E3C; line-height: 1; margin-bottom: 8px; }
    h1 { font-size: 1.3rem; margin: 0 0 12px; color: #2C1810; }
    p { color: #6b5b4f; font-size: 0.95rem; line-height: 1.5; margin: 0 0 28px; }
    a {
      display: inline-block; padding: 12px 28px; background: linear-gradient(135deg, #5C3D2E, #8B5E3C);
      color: #fff; text-decoration: none; border-radius: 10px; font-weight: 600; font-size: 0.9rem;
    }
    a:hover { opacity: 0.9; }
  </style>
</head>
<body>
  <div class="card">
    <div class="code">400</div>
    <h1>Bad Request</h1>
    <p>The request couldn't be understood. Please check what you submitted and try again.</p>
    <a href="/">Return to Dashboard</a>
  </div>
</body>
</html>
